title: "Ramen"
prep_time: "10 minutes"
cook_time: "20 minutes"
servings: "4"
ingredients:
  - 1.2 liters chicken stock
  - 2 1/2 tbsp miso paste
  - 2 tbsp soy sauce
  - 1 tbsp oyster sauce
  - 2 cloves garlic, minced
  - 4 portions ramen noodles
  - 250g sliced cooked roast pork
  - 4 eggs
  - 1 can sweetcorn
instructions:
  - Boil a pot of water, and then carefully lower the eggs in and cook for 6 minutes, 30 seconds. Remove the eggs and place them in a bowl of cold water to cool.
  - In a separate large pot, fry the garlic on oil nfor 30 seconds before adding stock, soy, miso, and oyster sauce. Simmer for 10 minutes.
  - Add pork and sweetcorn to the stock and simmer for another 5 minutes to heat.
  - In a separate pot, cook the ramen noodles according to the package instructions. Drain and divide into bowls.
  - Peel the eggs and cut in half. Divide broth between bowls then top with eggs.
notes:
  - Bean sprouts, spring onions, and nori can be added as toppings.
  - Six and a half minutes should give soft boiled eggs with a runny yolk.
commentary: "We discovered ramen when we travelled to Japan, and have loved it ever since. Our kids love it too, especially the eggs!"
