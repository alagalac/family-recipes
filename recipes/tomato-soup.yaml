title: "Tomato Soup"
prep_time: "10 minutes"
cook_time: "35 minutes"
servings: "6"
ingredients:
  - 2 carrots
  - 2 sticks celery
  - 2 onions
  - 2 cloves garlic
  - 1.5 liters stock (chicken or vegetable)
  - 2 400g tins of plum tomatoes
  - 3 large ripe tomatoes
  - 1/2 bunch fresh basil (15g)
instructions:
  - Roughly chop the carrots, celery sticks, onions, and garlic.
  - Heat 2 tbsp olive oil in a large pot over medium heat and add the carrots, celery, onion, and garlic. Cook with lid ajar for 10-15 minutes.
  - Add the stock, tinned tomatoes, and fresh tomatoes. Bring to the boil and then simmer for 10 minutes with the lid on.
  - Remove from the heat, add basil leaves, and season to taste.
  - Blend with a stick blender until smooth. Serve with toasted ciabatta bread.
notes:
  - 
commentary: "This soup was a big hit with all the kids including Fraser, who had it as one of his first foods!"
attribution: "Ministry of Food by Jamie Oliver"