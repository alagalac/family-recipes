title: "Potato Salad"
prep_time: "15 minutes"
cook_time: "30 minutes"
servings: "8 as a side"
ingredients:
  - 800g cubed waxy potatoes (Vivaldi works well)
  - 1/3 cup cooked bacon
  - 1/3 cup frozen peas
  - 1 tbsp chives
  - 1/2 cup mayonnaise
  - 2 tbsp apple cider vinegar
  - 1 tsp dijon mustard
  - 1 tsp wholegrain mustard
  - 1 tbsp honey
instructions:
  - Boil potatoes in salted water until soft, about 15 minutes. Then drain and allow to cool.
  - Add the mayonnaise, apple cider vinegar, dijon mustard, wholegrain mustard and honey to a small jar, screw lid on tight and shake well to mix.
  - Add the cooled potatoes, bacon, peas and chives to a large bowl. Pour over the dressing and mix well.
notes:
  - Hard boiled eggs are another common addition to potato salad but not everybody likes it.
  - This salad keeps well in the fridge and is great served cold.
commentary: "Grandpa loves potato salad, and this recipe is really easy!"
attribution: "Adapted from Kiwi Country Girl"
