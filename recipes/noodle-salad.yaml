title: "Noodle Salad"
prep_time: "15 minutes"
cook_time: "20 minutes"
servings: "4"
ingredients:
  - 500g fresh noodles
  - 100g beef eye fillet
  - 200g frozen shelled edamame beans
  - 100g bean sprouts
  - 1 carrot, julienned
  - 1/2 iceberg lettuce, shredded
  - 1/2 cup roasted peanuts, chopped
  - 1/4 cup dressing of choice
instructions:
  - Season and then cook the beef to your liking. Allow it to rest then slice thinly.
  - Cook the noodles according to packet instructions.
  - Cook the edamame beans according to packet instructions.
  - Combine all ingredients in a large bowl and toss with the dressing of your choice.
notes:
  - I like to make a quick homemade honey mustard dressing. A sichuan spice dressing also goes well if you can handle the spice!
  - Pork filet or chicken breast also work well for the protein, however make sure they are well cooked!
  - Hing's Fresh Noodles is the authentic brand which Chef's Palette seems to use.
commentary: "This recipe is inspired by the Wellington lunchtime classic: Chef's Palette."
